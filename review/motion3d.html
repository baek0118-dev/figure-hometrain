<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 동작 시험판</title>
  <script type="importmap">
  { "imports": {
      "three": "../vendor/three/three.module.min.js",
      "three/addons/": "../vendor/three/addons/"
  } }
  </script>
  <style>
    :root { --bg:#f6f7fb; --surface:#fff; --surface2:#eef0f7; --text:#14161f; --muted:#5b6070; --line:#d9dce6; --accent:#4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    header { padding: 16px 16px 4px; } h1 { font-size: 22px; margin: 0 0 6px; }
    .how { background: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 15px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 0; }
    .row button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--text); }
    .row button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
    .stage { position: relative; margin: 12px 16px; height: min(70vh, 640px); border-radius: 18px; overflow: hidden; background: var(--surface2); }
    #view { position: absolute; inset: 0; }
    .count { position: absolute; right: 18px; top: 10px; font-size: 64px; font-weight: 900; color: var(--accent); text-shadow: 0 2px 0 #fff; }
    .msg { position: absolute; left: 12px; bottom: 12px; right: 12px; background: rgba(20,22,31,.8); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 15px; display: none; }
    .info { padding: 0 16px 30px; } .info h2 { font-size: 20px; margin: 8px 0 4px; } .cp { margin: 0; padding-left: 0; list-style: none; }
    .legend { color: var(--muted); font-size: 14px; }
    /* 휴대폰(좁은 화면): 그림을 먼저 크게, 버튼은 그 아래 작게 */
    @media (max-width: 700px) {
      .page { display: flex; flex-direction: column; }
      .stage { order: -1; height: 62vh; margin: 8px 12px; }
      .row { padding: 6px 12px 0; gap: 6px; }
      .row button { padding: 7px 12px; font-size: 15px; }
      .count { font-size: 48px; }
      header { padding: 10px 12px 0; } .how { font-size: 14px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
<header>
  <h1>⛸ 3D 동작 시험판</h1>
  <div class="how">
    유하가 매트에서 <b>2m 떨어져</b> 보고 따라 해 보세요. <b>주황 = 오른발, 초록 = 왼발</b>이에요.<br>
    <b>몸</b>(새 사람형 · 지금 인형)과 <b>움직임</b>(영상에서 뽑음 · 손으로 만듦)을 바꿔 가며 비교해 보세요.
  </div>
</header>
<div class="page">
<div class="controls">
<div class="row" id="motions"></div>
<div class="row" id="bodies"></div>
<div class="row" id="sources"></div>
<div class="row" id="cams"></div>
<div class="row" id="opts"></div>
</div>
<div class="stage"><div id="view"></div><div class="count" id="count"></div><div class="msg" id="msg"></div></div>
<section class="info"><h2 id="name"></h2><div id="plan" class="legend"></div><ul class="cp" id="cp"></ul><div class="legend" id="note"></div></section>
</div>
<script type="module">
import { EXERCISES } from '../src/data/exercises.js?v=v-bf173709d19a';
import { motion3dFor } from '../src/data/motions3d.js?v=v-bf173709d19a';
import { videoMotionFor } from '../src/data/motions-video.js?v=v-bf173709d19a';
import { createStickman } from '../src/ui/components/stickman.js?v=v-bf173709d19a';
// 3D 쪽(three·import map 이 필요한 것)은 아래 try 안에서 불러온다 — 못 불러오면 막대 그림으로 대신 보여 주기 위해
let BASE_FACTOR = 2, SLOW_FACTOR = 4;

const TRY = ['J03', 'J01', 'S05'];
const $ = id => document.getElementById(id);
const state = { ex: TRY[0], cam: null, slow: false, mirror: false, theme: 'day', body: 'doll', source: 'video' }; // 몸은 지금 인형(가족 결정 2026-10-26)
const exOf = () => EXERCISES.find(x => x.id === state.ex);
// 영상에서 뽑은 동작이 있으면 그것, 없거나 '손으로 만듦'을 고르면 지금 동작
const motionOf = () => (state.source === 'video' && videoMotionFor(exOf().poseId)) || motion3dFor(exOf().poseId);
const msg = t => { $('msg').textContent = t ?? ''; $('msg').style.display = t ? 'block' : 'none'; };

function buttons(host, items, isOn, onClick) {
  host.innerHTML = '';
  for (const [key, label] of items) {
    const b = document.createElement('button'); b.textContent = label; b.className = isOn(key) ? 'on' : '';
    b.onclick = () => { onClick(key); render(); }; host.appendChild(b);
  }
}

let viewer = null;
try {
  const [pose3d, { createViewer }, { createMannequin }, { createKidBody }] = await Promise.all([
    import('../src/domain/pose3d.js'), import('../src/ui/three/viewer.js'), import('../src/ui/three/mannequin.js'), import('../src/ui/three/body.js')]);
  ({ BASE_FACTOR, SLOW_FACTOR } = pose3d);
  viewer = createViewer($('view'));
  // 몸 두 가지를 같은 움직임으로 비교(설계 2026-10-25 §5). 몸은 한 번씩만 만든다(리그가 쉬는 자세를 한 번 잼).
  const models = { kid: createKidBody(), doll: createMannequin() };
  let shown = null;
  viewer.pickBody = key => { if (shown !== key) { shown = key; viewer.setModel(models[key]); } };
} catch (e) {
  // WebGL 이 안 되면 지금 스틱맨으로
  msg('3D 를 못 그리는 기기라 막대 그림으로 보여 줘요');
  const sm = createStickman($('view'));
  viewer = { setModel() {}, pickBody() {}, setCamera() {}, setMirror() {}, setTheme() {}, show: m => sm.show(EXERCISES.find(x => x.id === state.ex).poseId, { slow: state.slow ? SLOW_FACTOR : BASE_FACTOR }), stop: () => sm.stop() };
}

function play() {
  const ex = exOf();
  const motion = motionOf();
  const cam = state.cam ?? motion.camera;
  viewer.setCamera(cam);
  $('count').textContent = ex.mode === 'reps' ? '0' : '';
  viewer.show(motion, {
    slow: state.slow ? SLOW_FACTOR : BASE_FACTOR,
    onCycle: c => { if (ex.mode === 'reps') $('count').textContent = String(c); },
  });
  $('name').textContent = `${ex.id} ${ex.name}`;
  const lv = ex.levels[0];
  $('plan').textContent = ex.mode === 'reps' ? `🔢 횟수: ${lv.reps}회 × ${lv.sets}세트 — 그림 한 번 = 1회 (그림은 실제의 ${state.slow ? '1/4' : '1/2'} 속도)` : ex.mode === 'hold' ? `✋ 버티기: ${lv.workSec}초 × ${lv.sets}세트` : `⏱ 시간: ${lv.workSec}초`;
  $('cp').innerHTML = ex.checkpoints.map((c, i) => `<li>${'①②③'[i]} ${c}</li>`).join('');
  $('note').textContent = motion.source === 'video'
    ? `🎬 영상에서 뽑은 움직임: ${motion.from.channel} 영상 ${motion.from.start}~${motion.from.end}초${motion.mirrored ? ' (우리 방향에 맞게 좌우를 뒤집음)' : ''}`
    : motion.source === 'hand' ? '✋ 손으로 만든 3D 동작' : '2D 그림 자동 변환(초안)';
}

function render() {
  buttons($('motions'), TRY.map(id => [id, EXERCISES.find(x => x.id === id).name]), k => k === state.ex, k => { state.ex = k; state.cam = null; });
  buttons($('bodies'), [['kid', '🧍 새 사람형'], ['doll', '🪆 지금 인형']], k => k === state.body, k => { state.body = k; });
  const hasVideo = !!videoMotionFor(exOf().poseId);
  buttons($('sources'), hasVideo ? [['video', '🎬 영상에서 뽑은 움직임'], ['hand', '✋ 손으로 만든 움직임']] : [], k => k === state.source, k => { state.source = k; });
  buttons($('cams'), [['side', '옆'], ['front', '앞'], ['diag', '비스듬히']], k => k === (state.cam ?? motionOf().camera), k => { state.cam = k; });
  buttons($('opts'), [['slow', '🐢 더 느리게'], ['mirror', '🪞 거울'], ['day', '☀ 기본'], ['night', '🌙 야간'], ['sun', '🔆 야외']],
    k => (k === 'slow' && state.slow) || (k === 'mirror' && state.mirror) || k === state.theme,
    k => { if (k === 'slow') state.slow = !state.slow; else if (k === 'mirror') state.mirror = !state.mirror; else state.theme = k; });
  viewer.pickBody(state.body);
  viewer.setMirror(state.mirror);
  viewer.setTheme(state.theme);
  play();
}

render();
</script>
</body>
</html>
