<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="피겨 지상훈련">
  <meta name="theme-color" content="#0b0b10">
  <title>피겨 지상훈련</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <script src="vendor/tailwind-3.4.17.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)', surface: 'var(--surface)', surface2: 'var(--surface2)',
            ink: 'var(--text)', muted: 'var(--muted)', line: 'var(--line)', accent: 'var(--accent)',
            prep: 'var(--prep)', work: 'var(--work)', rest: 'var(--rest)', switch: 'var(--switch)',
            onphase: 'var(--on-phase)', onprep: 'var(--on-prep)',
          },
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    /* 테마 토큰 — 설계 §11.2 (day / night / outdoor) */
    :root, [data-theme="day"] {
      --bg: #f6f7fb; --surface: #ffffff; --surface2: #eceef6; --text: #14161f; --muted: #5b6070;
      --line: #d9dce6; --accent: #4f46e5; --on-phase: #ffffff; --on-prep: #1a1400;
      --prep: #f2b705; --work: #15803d; --rest: #1d4ed8; --switch: #7e22ce;
    }
    [data-theme="night"] {
      --bg: #0b0b10; --surface: #15151d; --surface2: #1f1f2a; --text: #ffcf8a; --muted: #b39467;
      --line: #2e2e3b; --accent: #ff9f43; --on-phase: #fff3dd; --on-prep: #0b0b10;
      --prep: #d9a933; --work: #2f7a4a; --rest: #3d5c96; --switch: #6d4b8f;
    }
    [data-theme="outdoor"] {
      --bg: #ffffff; --surface: #ffffff; --surface2: #f0f0f0; --text: #000000; --muted: #1f1f1f;
      --line: #000000; --accent: #0033cc; --on-phase: #ffffff; --on-prep: #000000;
      --prep: #ffcc00; --work: #007a00; --rest: #0044dd; --switch: #7a00c4;
    }

    /* 화면 고정 — 설계 §3.5: 100dvh, 탄성 스크롤·더블탭 확대·길게 눌러 메뉴 막기 */
    html, body {
      position: fixed; inset: 0; height: 100dvh; width: 100vw; margin: 0;
      overflow: hidden; overscroll-behavior: none;
      background: var(--bg); color: var(--text);
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #app {
      position: absolute; inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    [data-screen] { position: absolute; inset: 0; display: flex; flex-direction: column; }
    [data-screen][hidden] { display: none; }
    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .nums { font-variant-numeric: tabular-nums; }
    button { touch-action: manipulation; }

    /* 세로 덮개 — iOS 는 방향 잠금 API 없음 */
    #rotate { display: none; }
    @media (orientation: portrait) {
      #rotate {
        display: flex; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center;
        flex-direction: column; gap: 24px; background: var(--bg); color: var(--text); font-size: 40px; font-weight: 800;
      }
    }
  </style>
</head>
<body data-theme="day" class="font-sans">
  <div id="app">
    <section data-screen="start"></section>
    <section data-screen="menu" hidden></section>
    <section data-screen="player" hidden></section>
    <section data-screen="stats" hidden></section>
    <section data-screen="settings" hidden></section>
    <div id="modal"></div>
  </div>
  <div id="rotate" role="alert"><div style="font-size:96px">🔄</div>가로로 돌려 주세요</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
