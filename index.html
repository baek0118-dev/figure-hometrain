<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="피겨 지상훈련">
  <meta name="theme-color" content="#0b0b10">
  <title>피겨 지상훈련</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <!-- 3D 인형(플레이어)용: three 를 vendor 에서 (설계 메모 2026-10-12-app-flow-ui-design §2.2) -->
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script src="vendor/tailwind-3.4.17.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // 화면 2차(docs/plans/2026-10-26-app-ui-round2-plan.md): narrow = 휴대폰 세로, tallwide = 아이패드 세로, short = 휴대폰 가로(낮은 가로)
          screens: {
            narrow: { raw: '(orientation: portrait) and (max-width: 600px)' },
            tallwide: { raw: '(orientation: portrait) and (min-width: 601px)' },
            short: { raw: '(orientation: landscape) and (max-height: 520px)' },
          },
          colors: {
            bg: 'var(--bg)', surface: 'var(--surface)', surface2: 'var(--surface2)',
            ink: 'var(--text)', muted: 'var(--muted)', line: 'var(--line)', accent: 'var(--accent)',
            prep: 'var(--prep)', work: 'var(--work)', rest: 'var(--rest)', switch: 'var(--switch)',
            onphase: 'var(--on-phase)', onprep: 'var(--on-prep)',
          },
          fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'] },
          // 디자인 A(2026-10-26): 굵기를 한 단계 낮춰 '어른 앱'처럼 — 가변 글꼴이라 중간 굵기도 됨
          fontWeight: { bold: '650', extrabold: '730' },
        },
      },
    };
  </script>
  <style>
    /* 글꼴: Pretendard 가변(오프라인, vendor/VERSIONS.md) */
    @font-face { font-family: Pretendard; src: url('vendor/fonts/PretendardVariable-ksx-1.3.9.woff2') format('woff2'); font-weight: 45 920; font-display: swap; }

    /* 테마 토큰 — 설계 §11.2 (day / night / outdoor) · 디자인 A 클린 라이트(2026-10-26)
       --shadow: 카드 그림자, --cat-*: 블록 색 점 */
    :root, [data-theme="day"] {
      --bg: #f2f4f6; --surface: #ffffff; --surface2: #f2f4f6; --text: #191f28; --muted: #6b7684;
      --line: #e5e8eb; --accent: #3182f6; --on-phase: #ffffff; --on-prep: #191f28;
      --prep: #ff9f0a; --work: #3182f6; --rest: #00a77d; --switch: #7c5cfc;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
      --cat-jump: #3182f6; --cat-spin: #7c5cfc; --cat-balance: #00a77d; --cat-flex: #ff8a3d;
    }
    /* 밤: 눈부시지 않게 따뜻한 흰 글자, 파랑 대신 주황 */
    [data-theme="night"] {
      --bg: #101113; --surface: #1c1d21; --surface2: #26272c; --text: #ece7df; --muted: #9a958c;
      --line: #2e2f35; --accent: #f0a35e; --on-phase: #101113; --on-prep: #101113;
      --prep: #d9a933; --work: #f0a35e; --rest: #6fae86; --switch: #a58bd6;
      --shadow: none;
      --cat-jump: #f0a35e; --cat-spin: #a58bd6; --cat-balance: #6fae86; --cat-flex: #d98c8c;
    }
    /* 야외(햇빛): 흰 바탕·검은 글자·진한 색, 테두리로 구분 */
    [data-theme="outdoor"] {
      --bg: #ffffff; --surface: #ffffff; --surface2: #eef0f3; --text: #000000; --muted: #2b2f36;
      --line: #000000; --accent: #0050d0; --on-phase: #ffffff; --on-prep: #000000;
      --prep: #ffb800; --work: #0050d0; --rest: #007a3d; --switch: #6b00c9;
      --shadow: 0 0 0 2px #000;
      --cat-jump: #0050d0; --cat-spin: #6b00c9; --cat-balance: #007a3d; --cat-flex: #c84b00;
    }

    /* 화면 고정 — 설계 §3.5: 100dvh, 탄성 스크롤·더블탭 확대·길게 눌러 메뉴 막기 */
    html, body {
      position: fixed; inset: 0; height: 100dvh; width: 100vw; margin: 0;
      overflow: hidden; overscroll-behavior: none;
      background: var(--bg); color: var(--text);
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #app {
      position: absolute; inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    [data-screen] { position: absolute; inset: 0; display: flex; flex-direction: column; }
    [data-screen][hidden] { display: none; }
    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .nums { font-variant-numeric: tabular-nums; }
    .card { background: var(--surface); box-shadow: var(--shadow); }
    .ico { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .seg { display: flex; padding: 4px; gap: 2px; border-radius: 14px; background: var(--surface2); }
    .seg > button { border-radius: 10px; color: var(--muted); font-weight: 600; }
    .seg > button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    [data-theme="night"] .seg > button.on { background: #3a3b41; box-shadow: none; }
    [data-theme="outdoor"] .seg > button.on { background: #000; color: #fff; }
    button { touch-action: manipulation; }

  </style>
</head>
<body data-theme="day" class="font-sans">
  <div id="app">
    <section data-screen="start"></section>
    <section data-screen="menu" hidden></section>
    <section data-screen="player" hidden></section>
    <section data-screen="stats" hidden></section>
    <section data-screen="settings" hidden></section>
    <div id="modal"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
